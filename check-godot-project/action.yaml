name: "✅ Check: Check Godot project source code"
description: "Formats and lints source code for a Godot project."

inputs:
  path:
    description: "Path to the Godot project."
    required: false
    default: "."
  ignore-lint-errors:
    description: "Whether to ignore 'gdlint' errors."
    required: false
    default: false
  line-length-max:
    description: "Overrides the max line length; defaults to the project's 'gdformatrc'."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # NOTE: The consuming repository must declare its tooling in a 'pyproject.toml';
    # there is no fallback.
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        enable-cache: true

    - name: Verify the lockfile is up to date
      shell: bash
      run: uv lock --check

    - name: Set up 'gdtoolkit'
      shell: bash
      run: uv sync

    - uses: "$/.github/actions/check-code-formatting"
      with:
        check-command: >-
          uv run gdformat
          ${{ inputs.line-length-max != '' && format('-l {0}', inputs.line-length-max) || '' }}
          --check ${{ inputs.path }}
        fix-command: >-
          uv run gdformat
          ${{ inputs.line-length-max != '' && format('-l {0}', inputs.line-length-max) || '' }}
          ${{ inputs.path }}

    - name: Lint project
      shell: bash
      continue-on-error: ${{ fromJson(inputs.ignore-lint-errors) }}
      run: uv run gdlint ${{ inputs.path }}
