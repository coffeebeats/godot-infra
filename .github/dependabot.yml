# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Update 'GitHub Actions' dependencies
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/actions/*"
      - "/.github/actions/*"
    reviewers:
      - coffeebeats
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 30

  # Update the base images of the export and compile containers
  - package-ecosystem: "docker"
    directories:
      - "/actions/*/*"
    reviewers:
      - coffeebeats
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 30

  # Update Python tooling dependencies
  - package-ecosystem: "uv"
    directory: "/"
    reviewers:
      - coffeebeats
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 30

  # Update the Web boot harness' npm dependencies
  - package-ecosystem: "npm"
    directory: "/actions/boot-godot-project/web"
    reviewers:
      - coffeebeats
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 30
