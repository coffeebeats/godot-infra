name: "🚀 Release: Addon version"

# A reusable workflow that runs release-please for an addon repository and,
# when a release is created, packages the addon and publishes it as a commit on
# its distribution branch, tagged 'dist/<release tag>'.
#
# NOTE: A 'workflow_dispatch' run republishes the dispatched ref without a tag.
# Consumers track the branch, so dispatch at a release tag rather than 'main'.
#
# NOTE: There is no game release workflow, because a job's '$/' cannot nest
# 'publish-game.yaml' for an external caller. This one calls only actions.
#
# Caller requirements:
#   on: push: branches: [main]; workflow_dispatch (optional, repackages)
#   permissions: contents: write, issues: write, pull-requests: write
#   secrets: inherit (RELEASE_PLEASE_TOKEN optional)

on:
  workflow_call:
    inputs:
      subfolder:
        type: string
        description: "The subfolder under 'addons' to package the addon into (default: the repository name without a 'godot-plugin-' prefix)."
        required: false
        default: ""
      target-branch:
        type: string
        description: "The branch to publish the packaged addon to."
        required: false
        default: dist
      godot-editor-version:
        type: string
        description: "The Godot editor version to reimport with (default: the project's '.godot-version' pin)."
        required: false
        default: ""
      file-excludes:
        type: string
        description: "A newline-delimited list of glob patterns to exclude from the packaged addon."
        required: false
        default: |
          **/AGENTS.md
          **/CLAUDE.md
          **/pyproject.toml
          **/uv.lock

          **/example
          **/examples
          **/*_test.gd
          **/*_test.gd.uid

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 4

    outputs:
      release-created: ${{ steps.release.outputs.releases_created }}
      release-tag: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          config-file: .release-please/config.json
          manifest-file: .release-please/manifest.json

          # NOTE: Releasing from another branch (e.g. a '1.X' release branch)
          # takes a change to the 'branches' filter on the caller's 'push'
          # trigger.
          target-branch: ${{ github.ref_name }}

          # NOTE: A PAT lets the release PR trigger workflows; it needs
          # 'contents:write' and 'pull-requests:write'.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Log release-please action output
        shell: bash
        env:
          # See https://github.com/actions/runner/issues/1656#issuecomment-1030077729.
          RELEASE_INFO: ${{ toJson(steps.release.outputs) }}
        run: echo "$RELEASE_INFO"

  release-branch:
    needs: ["release-please"]
    if: |
      !failure() && !cancelled() && (
        needs.release-please.outputs.release-created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )

    runs-on: ubuntu-latest
    timeout-minutes: 5

    # NOTE: Each run commits on top of the branch, so two runs must not race.
    concurrency:
      group: "dist-${{ github.repository }}"
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true

      - name: Determine packaging inputs
        id: package
        shell: bash
        env:
          SUBFOLDER: ${{ inputs.subfolder }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release-created }}
          RELEASE_TAG: ${{ needs.release-please.outputs.release-tag }}
        run: |
          NAME="${REPOSITORY#*/}"

          TAG=""
          if [[ "$RELEASE_CREATED" == "true" && -n "$RELEASE_TAG" ]]; then
            TAG="dist/$RELEASE_TAG"
          fi

          {
            echo "subfolder=${SUBFOLDER:-${NAME#godot-plugin-}}"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - uses: $/actions/package-addon
        with:
          subfolder: ${{ steps.package.outputs.subfolder }}
          target-branch: ${{ inputs.target-branch }}
          godot-editor-version: ${{ inputs.godot-editor-version }}
          file-excludes: ${{ inputs.file-excludes }}
          tag: ${{ steps.package.outputs.tag }}
