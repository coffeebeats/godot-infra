name: "🔎 Check: Python source code"

on:
  pull_request:
    branches:
      - main
      - godot-v*
  push:
    branches:
      - main
      - godot-v*

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check-python:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Verify the lockfile is up to date
        run: uv lock --check

      - name: Lint Python source code
        run: uv run ruff check .
