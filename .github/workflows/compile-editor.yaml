name: "🤖 Compile: Godot editor"

# A reusable workflow that compiles one custom Godot editor from a project's
# pinned engine version and patches, then publishes it as an artifact.
#
# NOTE: The caller chooses which editors to build and when. A project that
# rebuilds only when its engine pin or patches change gates the call itself,
# which keeps the trigger and the condition in the same file.
#
# Caller requirements:
#   permissions: contents: read

on:
  workflow_call:
    inputs:
      platform:
        type: string
        description: "The target platform for the editor build ('macos' or 'windows')."
        required: true
      arch:
        type: string
        description: "The target CPU architecture for the editor build ('arm64' or 'x86_64')."
        required: true
      profile:
        type: string
        description: "The optimization profile of the compiled editor."
        required: false
        default: release
      ref:
        type: string
        description: "The branch or tag name to check out. If empty, uses the triggering event's SHA."
        required: false
        default: ""
      patches-path:
        type: string
        description: "A glob matching the engine patches to apply."
        required: false
        default: ".patches/godotengine/godot/*"
      timeout:
        type: number
        description: "The maximum allowed duration of the compile job (in minutes)."
        required: false
        default: 150

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}

    steps:
      - name: Reclaim disk space
        uses: $/.github/actions/setup-runner

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}

      - uses: $/.github/actions/parse-godot-version
        id: version
        with:
          gdenv-pin-path: .godot-version

      - uses: $/actions/compile-godot-export-template
        with:
          compile-editor: true
          publish: true

          godot-src-rev: ${{ steps.version.outputs.semantic }}
          godot-patches: ${{ inputs.patches-path }}

          platform: ${{ inputs.platform }}
          arch: ${{ inputs.arch }}
          profile: ${{ inputs.profile }}
