name: "🐳 Publish: 'godot-infra' images (all platforms)"

# NOTE: This workflow is intended to be used during releases.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      godot-major-minor-version:
        type: string
        description: "The Godot major-minor version to build images for (default: the last line of 'godot-versions.txt')."
        required: false
      force:
        type: boolean
        description: Rebuild all images without using the cache.
        required: false
        default: true

permissions:
  contents: write
  packages: write

jobs:
  build-required:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    outputs:
      version: ${{ steps.target.outputs.version }}
      compile-godot-export-template-macos: ${{ github.event_name == 'workflow_dispatch' || steps.compile-godot-export-template-macos.outputs.any_modified == 'true' || steps.missing.outputs.compile-godot-export-template-macos == 'true' }}
      compile-godot-export-template-windows: ${{ github.event_name == 'workflow_dispatch' || steps.compile-godot-export-template-windows.outputs.any_modified == 'true' || steps.missing.outputs.compile-godot-export-template-windows == 'true' }}
      compile-godot-export-template-web: ${{ github.event_name == 'workflow_dispatch' || steps.compile-godot-export-template-web.outputs.any_modified == 'true' || steps.missing.outputs.compile-godot-export-template-web == 'true' }}
      export-godot-project-preset-macos: ${{ github.event_name == 'workflow_dispatch' || steps.export-godot-project-preset-macos.outputs.any_modified == 'true' || steps.missing.outputs.export-godot-project-preset-macos == 'true' }}
      export-godot-project-preset-windows: ${{ github.event_name == 'workflow_dispatch' || steps.export-godot-project-preset-windows.outputs.any_modified == 'true' || steps.missing.outputs.export-godot-project-preset-windows == 'true' }}
      export-godot-project-preset-web: ${{ github.event_name == 'workflow_dispatch' || steps.export-godot-project-preset-web.outputs.any_modified == 'true' || steps.missing.outputs.export-godot-project-preset-web == 'true' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      # NOTE: 'main' only ever builds images for the newest supported minor (the
      # last line of 'godot-versions.txt'). Older minors' tags are frozen; rebuild
      # one by dispatching this workflow from the commit that targeted it.
      - name: Determine the target major-minor version
        id: target
        shell: bash
        env:
          VERSION_OVERRIDE: ${{ inputs.godot-major-minor-version }}
        run: |
          VERSION="$VERSION_OVERRIDE"
          if [[ -z "$VERSION" ]]; then
            VERSION="$(grep -v '^#' godot-versions.txt | grep -v '^$' | tail -n 1)"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Failed to determine a valid major-minor version: '$VERSION'"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # NOTE: The '*.sh' build commands are mounted into the container at run
      # time rather than baked in, so a change to one must not rebuild an image
      # whose tag consumers already pin.

      # compile-godot-export-template

      - id: compile-godot-export-template-macos
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          files: actions/compile-godot-export-template/macos/
          files_ignore: actions/compile-godot-export-template/macos/*.sh

      - id: compile-godot-export-template-windows
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          files: actions/compile-godot-export-template/windows/
          files_ignore: actions/compile-godot-export-template/windows/*.sh

      - id: compile-godot-export-template-web
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          files: actions/compile-godot-export-template/web/
          files_ignore: actions/compile-godot-export-template/web/*.sh

      # export-godot-project-preset

      - id: export-godot-project-preset-macos
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          files: actions/export-godot-project-preset/macos/
          files_ignore: actions/export-godot-project-preset/macos/*.sh

      - id: export-godot-project-preset-windows
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          files: actions/export-godot-project-preset/windows/
          files_ignore: actions/export-godot-project-preset/windows/*.sh

      - id: export-godot-project-preset-web
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          files: actions/export-godot-project-preset/web/
          files_ignore: actions/export-godot-project-preset/web/*.sh

      # Check for images

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check for missing images
        id: missing
        shell: bash
        run: |
          for img in compile-godot-export-template export-godot-project-preset; do
            for platform in macos windows web; do
              if [[ $(docker manifest inspect ghcr.io/coffeebeats/$img:godot-v${{ steps.target.outputs.version }}-$platform &>/dev/null; echo $?) -ne 0 ]]; then
                echo "$img-$platform=true" >> $GITHUB_OUTPUT
              fi
            done
          done

  compile-godot-export-template-macos:
    needs: ["build-required"]

    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.build-required.outputs.compile-godot-export-template-macos == 'true'

    uses: ./.github/workflows/publish-image-compile-godot-export-template.yaml
    with:
      platform: "macos"
      godot-major-minor-version: ${{ needs.build-required.outputs.version }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}

  compile-godot-export-template-windows:
    needs: ["build-required"]

    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.build-required.outputs.compile-godot-export-template-windows == 'true'

    uses: ./.github/workflows/publish-image-compile-godot-export-template.yaml
    with:
      platform: "windows"
      godot-major-minor-version: ${{ needs.build-required.outputs.version }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}

  compile-godot-export-template-web:
    needs: ["build-required"]

    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.build-required.outputs.compile-godot-export-template-web == 'true'

    uses: ./.github/workflows/publish-image-compile-godot-export-template.yaml
    with:
      platform: "web"
      godot-major-minor-version: ${{ needs.build-required.outputs.version }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}

  export-godot-project-preset-macos:
    needs: ["build-required"]

    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.build-required.outputs.export-godot-project-preset-macos == 'true'

    uses: ./.github/workflows/publish-image-export-godot-project-preset.yaml
    with:
      platform: "macos"
      godot-major-minor-version: ${{ needs.build-required.outputs.version }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}

  export-godot-project-preset-windows:
    needs: ["build-required"]

    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.build-required.outputs.export-godot-project-preset-windows == 'true'

    uses: ./.github/workflows/publish-image-export-godot-project-preset.yaml
    with:
      platform: "windows"
      godot-major-minor-version: ${{ needs.build-required.outputs.version }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}

  export-godot-project-preset-web:
    needs: ["build-required"]

    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.build-required.outputs.export-godot-project-preset-web == 'true'

    uses: ./.github/workflows/publish-image-export-godot-project-preset.yaml
    with:
      platform: "web"
      godot-major-minor-version: ${{ needs.build-required.outputs.version }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
