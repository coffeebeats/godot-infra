name: "🌐 Publish: Godot game"

# A reusable workflow that compiles a custom export template for the project's
# pinned Godot version, exports every preset matching the requested target,
# packages them into one archive, and optionally publishes it to itch.io.
#
# Caller requirements:
#   permissions: contents: read
#   secrets: inherit (optional; see the secret names below)
#
# Secrets read (all optional; unset means unsigned/unencrypted):
#   GODOT_SCRIPT_ENCRYPTION_KEY
#   GODOT_WINDOWS_CODESIGN_IDENTITY_TYPE, GODOT_WINDOWS_CODESIGN_IDENTITY,
#   GODOT_WINDOWS_CODESIGN_PASSWORD
#   GODOT_MACOS_CODESIGN_CERTIFICATE_FILE, GODOT_MACOS_CODESIGN_CERTIFICATE_PASSWORD,
#   GODOT_MACOS_CODESIGN_PROVISIONING_PROFILE, GODOT_MACOS_NOTARIZATION_API_UUID,
#   GODOT_MACOS_NOTARIZATION_API_KEY, GODOT_MACOS_NOTARIZATION_API_KEY_ID,
#   GODOT_MACOS_NOTARIZATION_APPLE_ID_NAME, GODOT_MACOS_NOTARIZATION_APPLE_ID_PASSWORD
#   BUTLER_API_KEY (required when 'publish-to-itchio' is set)

on:
  workflow_call:
    inputs:
      ref:
        type: string
        description: "The branch or tag name to check out. If empty, uses either the triggering event's SHA or the HEAD commit of the default branch."
        required: false
      project-path:
        type: string
        description: "The path to the Godot project, relative to the repository root."
        required: false
        default: "."
      godot-version:
        type: string
        description: "A Godot version (e.g. '4.7.2-stable') to build with instead of the project's '.godot-version' pin. Artifact names gain a '-<version>' suffix so one run can export several versions."
        required: false
        default: ""
      component:
        type: string
        description: "Build only the presets whose name begins with this component. If empty, every preset for the requested platform, architecture and storefront is built and packaged together."
        required: false
        default: ""
      platform:
        type: string
        required: true
      arch:
        type: string
        required: true
      storefront:
        type: string
        required: true
      profile:
        type: string
        required: true
      publish-export-template:
        type: boolean
        required: false
        default: false

      # itch.io inputs
      publish-to-itchio:
        type: boolean
        description: "Whether to publish the packaged game to itch.io."
        required: false
        default: false
      version:
        type: string
        description: "The version to publish the game as (default: the value of 'ref')."
        required: false
        default: ""
      itchio-project:
        type: string
        description: "The itch.io project to publish to, as 'user/project', or 'project' to use this repository's owner."
        required: false
        default: ""
      itchio-label:
        type: string
        description: "An extra suffix for the itch.io channel (e.g. 'beta')."
        required: false
        default: ""

permissions:
  contents: read # Required to check out a private repository.

defaults:
  run:
    shell: bash

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    outputs:
      presets: ${{ steps.set-presets.outputs.value }}
      artifact-name: ${{ steps.set-presets.outputs.artifact-name }}
      template-artifact-name: ${{ steps.set-presets.outputs.template-artifact-name }}
      artifact-pattern: ${{ steps.set-presets.outputs.artifact-pattern }}
      artifact-suffix: ${{ steps.set-presets.outputs.artifact-suffix }}
      godot-version: "${{ steps.version.outputs.semantic }}"
      custompy-path: ${{ steps.files.outputs.custompy-path }}
      icon-path: ${{ steps.files.outputs.icon-path }}
      godot-patches: ${{ steps.files.outputs.godot-patches }}

    steps:
      # NOTE: This runs before the checkout so that a misconfigured publish
      # fails in seconds rather than after the engine compile.
      - name: Verify the itch.io inputs
        if: inputs.publish-to-itchio
        env:
          ITCHIO_PROJECT: ${{ inputs.itchio-project }}
          VERSION: ${{ inputs.version || inputs.ref }}
        run: |
          if [[ -z "$ITCHIO_PROJECT" ]]; then
            echo "::error::'itchio-project' is required when publishing to itch.io."
            exit 1
          fi

          if [[ -z "$VERSION" ]]; then
            echo "::error::'version' or 'ref' is required when publishing to itch.io."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}

      # NOTE: An explicit 'godot-version' overrides the project's pin. It is
      # written over the pin in this job's checkout only (the parser needs a
      # file inside the workspace); later jobs take the parsed version.
      - name: Apply the Godot version override
        if: inputs.godot-version != ''
        env:
          GODOT_VERSION: ${{ inputs.godot-version }}
          PROJECT_PATH: ${{ inputs.project-path }}
        run: echo "v${GODOT_VERSION#v}" > "$PROJECT_PATH/.godot-version"

      - uses: $/.github/actions/parse-godot-version
        id: version
        with:
          gdenv-pin-path: ${{ inputs.project-path }}/.godot-version

      # NOTE: Optional build inputs are only passed to the compile action when
      # the project has them.
      - name: Detect optional build inputs
        id: files
        env:
          PROJECT_PATH: ${{ inputs.project-path }}
        run: |
          cd "$PROJECT_PATH"

          if [[ -f custom.py ]]; then
            echo "custompy-path=$PROJECT_PATH/custom.py" >> "$GITHUB_OUTPUT"
          fi

          if [[ -f icon.svg ]]; then
            echo "icon-path=$PROJECT_PATH/icon.svg" >> "$GITHUB_OUTPUT"
          fi

          # NOTE: The glob skips dotfiles, so a directory holding only
          # '.gitkeep' correctly reads as having no patches.
          PATCHES=(.patches/godotengine/godot/*)

          if [[ -e "${PATCHES[0]}" ]]; then
            echo "godot-patches=$PROJECT_PATH/.patches/godotengine/godot/*" >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluate presets
        id: set-presets
        working-directory: ${{ inputs.project-path }}
        # NOTE: These inputs reach the script through the environment rather
        # than interpolation, so a dispatch-supplied 'component' cannot arrive
        # as shell code.
        env:
          COMPONENT: "${{ inputs.component }}"
          PROFILE: "${{ inputs.profile }}"
          TARGET: "${{ inputs.arch }}-${{ inputs.platform }}-${{ inputs.storefront }}"
          # NOTE: A version override means several versions may export in one
          # run, so every artifact name carries the version to stay unique.
          SUFFIX: "${{ inputs.godot-version != '' && format('-{0}', inputs.godot-version) || '' }}"
        run: |-
          # A preset belongs to this build when its name ends with the target
          # at a segment boundary and, when a component is named, begins with
          # that component. Each 'case' pattern quotes its variable, so glob
          # characters in a component match literally.
          PRESETS=()

          while IFS= read -r NAME; do
            case "$NAME" in
            "$TARGET" | *-"$TARGET") ;;
            *) continue ;;
            esac

            if [ -n "$COMPONENT" ]; then
              case "$NAME" in
              "$COMPONENT"-*) ;;
              *) continue ;;
              esac
            fi

            PRESETS+=("$NAME")
          done < <(grep '^name=' export_presets.cfg | sed 's/name=//' | sed 's/"//g')

          if [ ${#PRESETS[@]} -eq 0 ]; then
            echo "::error::'export_presets.cfg' defines no preset matching '${COMPONENT:+$COMPONENT-}*$TARGET'."
            exit 1
          fi

          {
            echo "value=$(jq -c -n '$ARGS.positional' --args "${PRESETS[@]}")"

            # Every artifact in the run is named here, from one rule, because
            # a matrix caller shares a single run and its artifact namespace.
            # 'game-' marks a packaged result and stays fixed so callers can
            # glob for it; 'export-' marks the per-preset intermediates.
            echo "artifact-name=game-${COMPONENT:+$COMPONENT-}$TARGET-$PROFILE$SUFFIX"
            echo "template-artifact-name=export-template-${COMPONENT:+$COMPONENT-}$TARGET-$PROFILE$SUFFIX"
            echo "artifact-suffix=$SUFFIX"

            # The 'package' job downloads what the 'export' job publishes
            # as 'export-<preset>', so this glob mirrors the rule above.
            # Anchoring the end stops 'steam' from selecting 'steamdeck'.
            echo "artifact-pattern=export-${COMPONENT:+$COMPONENT-}*$TARGET$SUFFIX"
          } >> "$GITHUB_OUTPUT"

  compile:
    needs: ["config"]

    runs-on: ubuntu-latest
    timeout-minutes: 120

    outputs:
      export-template-filename: ${{ steps.compile.outputs.export-template-filename }}
      extra-bundled-files: ${{ steps.compile.outputs.extra-bundled-files }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}

      - uses: $/actions/compile-godot-export-template
        id: compile
        with:
          publish: ${{ inputs.publish-export-template }}

          godot-src-rev: ${{ needs.config.outputs.godot-version }}
          godot-patches: ${{ needs.config.outputs.godot-patches }}

          platform: ${{ inputs.platform }}
          arch: ${{ inputs.arch }}

          custompy-path: ${{ needs.config.outputs.custompy-path }}
          icon-path: ${{ needs.config.outputs.icon-path }}
          profile: ${{ inputs.profile }}
          use-double-precision: false

          encryption-key: ${{ secrets.GODOT_SCRIPT_ENCRYPTION_KEY }}

      # NOTE: The export template passes between jobs as an artifact, which
      # every matrix member of the 'export' job can read without contention.
      - name: Upload the export template for the 'export' job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ needs.config.outputs.template-artifact-name }}
          path: ${{ steps.compile.outputs.path-artifact-dir }}
          if-no-files-found: error
          retention-days: 1

  export:
    needs: ["config", "compile"]

    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: true

      matrix:
        preset: ${{ fromJson(needs.config.outputs.presets) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          submodules: true

      - name: Download the export template
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.config.outputs.template-artifact-name }}
          path: ${{ runner.temp }}/build

      - name: Inspect compilation artifacts
        run: tree -lha --dirsfirst ${{ runner.temp }}/build

      # ----------------------- Export required presets ---------------------- #

      # NOTE: The 'compile' job emits bundle filepaths relative to the template
      # directory, so this step makes them absolute.
      - name: Compute 'extra-bundled-files'
        id: bundle
        env:
          BUILD_DIR: ${{ runner.temp }}/build
          PATTERNS: ${{ needs.compile.outputs.extra-bundled-files }}
        run: |
          # The compile action emits a space-delimited list, so splitting is
          # intended; 'read -ra' splits without letting a name reach the shell.
          read -ra NAMES <<< "$PATTERNS"

          {
            echo "files<<EOM"

            for NAME in "${NAMES[@]}"; do
              echo "$BUILD_DIR/$NAME"
            done

            echo "EOM"
          } >> "$GITHUB_OUTPUT"

      - uses: $/actions/export-godot-project-preset
        with:
          # NOTE: These are intermediate artifacts; 'package' collects them.
          publish: true
          artifact-name: "export-${{ matrix.preset }}${{ needs.config.outputs.artifact-suffix }}"
          artifact-retention-days: 1

          preset-name: "${{ matrix.preset }}"
          project-path: ${{ inputs.project-path }}

          godot-editor-version: ${{ needs.config.outputs.godot-version }}
          export-template-path: "${{ runner.temp }}/build/${{ needs.compile.outputs.export-template-filename }}"
          extra-bundled-files: ${{ steps.bundle.outputs.files }}

          profile: ${{ inputs.profile }}

          encryption-key: ${{ secrets.GODOT_SCRIPT_ENCRYPTION_KEY }}

          # Windows
          codesign-identity-type: ${{ secrets.GODOT_WINDOWS_CODESIGN_IDENTITY_TYPE }}
          codesign-identity: ${{ secrets.GODOT_WINDOWS_CODESIGN_IDENTITY }}
          codesign-password: ${{ secrets.GODOT_WINDOWS_CODESIGN_PASSWORD }}

          # MacOS
          codesign-certificate-file: ${{ secrets.GODOT_MACOS_CODESIGN_CERTIFICATE_FILE }}
          codesign-certificate-password: ${{ secrets.GODOT_MACOS_CODESIGN_CERTIFICATE_PASSWORD }}
          codesign-provisioning-profile: ${{ secrets.GODOT_MACOS_CODESIGN_PROVISIONING_PROFILE }}
          notarization-api-uuid: ${{ secrets.GODOT_MACOS_NOTARIZATION_API_UUID }}
          notarization-api-key: ${{ secrets.GODOT_MACOS_NOTARIZATION_API_KEY }}
          notarization-api-key-id: ${{ secrets.GODOT_MACOS_NOTARIZATION_API_KEY_ID }}
          notarization-apple-id-name: ${{ secrets.GODOT_MACOS_NOTARIZATION_APPLE_ID_NAME }}
          notarization-apple-id-password: ${{ secrets.GODOT_MACOS_NOTARIZATION_APPLE_ID_PASSWORD }}

  package:
    needs: ["config", "export"]

    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ARTIFACT_NAME: ${{ needs.config.outputs.artifact-name }}

    steps:
      - name: Download export preset artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: ${{ runner.temp }}/presets

          pattern: ${{ needs.config.outputs.artifact-pattern }}
          merge-multiple: true

      - name: Inspect game artifacts
        run: tree -lha --dirsfirst ${{ runner.temp }}/presets

      # NOTE: The archive makes one release asset per target, whatever mix of
      # files the matching presets produced.
      - name: Assemble the final game artifact
        env:
          PRESETS_DIR: ${{ runner.temp }}/presets
          ARCHIVE_PATH: ${{ runner.temp }}/${{ env.ARTIFACT_NAME }}.tar.gz
        run: |-
          cd "$PRESETS_DIR"

          # NOTE: '*' skips dotfiles, which would drop them from the release.
          shopt -s dotglob

          tar -czf "$ARCHIVE_PATH" -- *

          echo "Packaged export game artifacts into archive: $ARCHIVE_PATH"
          ls -ls "$ARCHIVE_PATH"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/${{ env.ARTIFACT_NAME }}.tar.gz
          if-no-files-found: error

      # NOTE: Uploading first means a failed push still leaves the packaged
      # game attached to the run.
      - name: Publish to 'itch.io'
        if: inputs.publish-to-itchio
        uses: $/actions/publish-project-itchio
        with:
          path: ${{ runner.temp }}/presets
          version: ${{ inputs.version || inputs.ref }}
          itchio-project: ${{ contains(inputs.itchio-project, '/') && inputs.itchio-project || format('{0}/{1}', github.repository_owner, inputs.itchio-project) }}
          itchio-channel: "${{ inputs.component != '' && format('{0}-', inputs.component) || '' }}${{ inputs.arch }}-${{ inputs.platform }}${{ inputs.itchio-label != '' && format('-{0}', inputs.itchio-label) || '' }}"
          api-key: ${{ secrets.BUTLER_API_KEY }}
