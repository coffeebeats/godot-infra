name: "🚀 Release: Project version"

# A reusable workflow that runs release-please for a game repository and, when
# a release is created, exports every target and attaches the results to the
# GitHub release.
#
# Caller requirements:
#   on: push: branches: [main]
#   permissions: contents: write, issues: write, pull-requests: write
#   secrets: inherit (RELEASE_PLEASE_TOKEN optional; BUTLER_API_KEY when a
#            target publishes to itch.io; export secrets per 'export-project.yaml')

on:
  workflow_call:
    inputs:
      project-path:
        type: string
        required: false
        default: "."
      targets:
        type: string
        description: "A JSON list of build targets, each an object with 'arch', 'platform', 'storefront' and optionally 'component', 'publish-to-itchio', 'itchio-project' and 'itchio-label'."
        required: false
        default: |
          [
            {"arch": "universal", "platform": "macos", "storefront": "unknown"},
            {"arch": "universal", "platform": "macos", "storefront": "steam"},
            {"arch": "wasm32", "platform": "web", "storefront": "unknown"},
            {"arch": "x86_64", "platform": "windows", "storefront": "unknown"},
            {"arch": "x86_64", "platform": "windows", "storefront": "steam"}
          ]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    outputs:
      release-created: ${{ steps.release.outputs.releases_created }}
      release-tag: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          config-file: .release-please/config.json
          manifest-file: .release-please/manifest.json

          # NOTE: Releasing from another branch (e.g. a '1.X' release branch)
          # takes a change to the 'branches' filter on the caller's 'push'
          # trigger.
          target-branch: ${{ github.ref_name }}

          # NOTE: Updating version text in workflow files takes a PAT with
          # 'contents:write' and 'workflows:write'; see
          # https://github.com/orgs/community/discussions/35410#discussioncomment-7645702.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Log release-please action output
        shell: bash
        env:
          # See https://github.com/actions/runner/issues/1656#issuecomment-1030077729.
          RELEASE_INFO: ${{ toJson(steps.release.outputs) }}
        run: echo "$RELEASE_INFO"

  publish:
    needs: ["release-please"]
    if: needs.release-please.outputs.release-created == 'true'

    strategy:
      fail-fast: false
      max-parallel: 2

      matrix:
        include: ${{ fromJson(inputs.targets) }}

    uses: $/.github/workflows/publish-game.yaml
    secrets: inherit
    with:
      arch: ${{ matrix.arch }}
      component: ${{ matrix.component || '' }}
      platform: ${{ matrix.platform }}
      profile: "release"
      project-path: ${{ inputs.project-path }}
      ref: ${{ needs.release-please.outputs.release-tag }}
      storefront: ${{ matrix.storefront }}

      # itch.io inputs
      publish-to-itchio: ${{ matrix.publish-to-itchio || false }}
      itchio-project: ${{ matrix.itchio-project }}
      itchio-label: ${{ matrix.itchio-label }}

  upload:
    needs: ["release-please", "publish"]
    if: needs.release-please.outputs.release-created == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          # NOTE: 'publish' is a matrix, which collapses job outputs to one value,
          # so this must glob. Every packaged artifact starts with 'game-'.
          pattern: "game-*"
          path: ${{ runner.temp }}/dist
          merge-multiple: true

      - name: Attach assets to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }} # Required by the 'gh' CLI.
          DIST: ${{ runner.temp }}/dist
          TAG: ${{ needs.release-please.outputs.release-tag }}
        run: |-
          for ASSET in "$DIST"/*; do
            echo "Attaching asset to release '$TAG': $ASSET"

            gh release upload --clobber "$TAG" "$ASSET"
          done
