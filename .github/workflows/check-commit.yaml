name: "🔎 Check: Source code"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# NOTE: A cancelled compile saves no cache, but a second multi-hour self-test
# running alongside the first is worse.
concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      has_pipeline_change: "${{ steps.check-pipeline.outputs.any_modified == 'true' }}"
      godot-versions: ${{ steps.versions.outputs.value }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # NOTE: The self-test compiles export templates, so only run it for
      # changes that can affect the pipeline (not scripts, docs, or releases).
      - name: Check for pipeline changes
        id: check-pipeline
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          files: |
            actions/**
            .github/**
            tests/**
            godot-versions.txt
            scripts/resolve_godot_versions.py

      - name: Resolve supported Godot versions
        id: versions
        run: echo "value=$(python3 scripts/resolve_godot_versions.py godot-versions.txt)" >> "$GITHUB_OUTPUT"

  check-python:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Verify the lockfile is up to date
        run: uv lock --check

      - name: Lint Python source code
        run: uv run ruff check .

      - name: Verify Python source code is formatted
        run: uv run ruff format --check .

  check-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      # NOTE: 'shellcheck' is preinstalled on GitHub-hosted Ubuntu runners.
      - name: Lint shell scripts
        run: |
          shopt -s globstar
          shellcheck --severity=warning actions/**/*.sh

      # NOTE: 'actionlint' reads only workflows, so the 'run:' blocks inside
      # 'action.yml' files are extracted and checked here.
      - name: Lint action 'run:' blocks
        run: uv run scripts/check_action_shell.py --severity=warning

  check-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # NOTE: 'actionlint' is not preinstalled, but 'go' is, and a pinned
      # module version is verified against the checksum database.
      - name: Install 'actionlint'
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      # NOTE: 'actionlint' also runs 'shellcheck' over every 'run:' block, at
      # its default severity.
      - name: Lint workflow files
        run: |
          # 'actionlint' predates '$/', so a step's 'uses' reads as malformed.
          # A job's 'uses' needs no ignore, because '$/' becomes './' there.
          "$(go env GOPATH)/bin/actionlint" -ignore 'specifying action "\$/'

  # The self-test exports the sample project with every supported Godot
  # version through the reusable workflows, so a release never ships an
  # untested pipeline.
  export:
    needs: ["changes"]
    if: needs.changes.outputs.has_pipeline_change == 'true'

    strategy:
      fail-fast: false

      matrix:
        version: ${{ fromJson(needs.changes.outputs.godot-versions) }}
        platform: [macos, web, windows]
        include:
          - platform: macos
            arch: universal
          - platform: web
            arch: wasm32
          - platform: windows
            arch: x86_64

    uses: ./.github/workflows/publish-game.yaml
    secrets: inherit
    with:
      project-path: tests/project
      godot-version: ${{ matrix.version }}
      platform: ${{ matrix.platform }}
      arch: ${{ matrix.arch }}
      storefront: unknown
      profile: release

  # The packaging self-test publishes a fixture addon to a local remote three
  # times, so a release never ships untested 'dist' branch or tag handling.
  package-addon:
    needs: ["changes"]
    if: needs.changes.outputs.has_pipeline_change == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Select the newest supported Godot version
        id: version
        env:
          VERSIONS: ${{ needs.changes.outputs.godot-versions }}
        run: echo "value=$(jq -r '.[-1]' <<<"$VERSIONS")" >> "$GITHUB_OUTPUT"

      - uses: $/.github/actions/setup-godot
        with:
          version: ${{ steps.version.outputs.value }}

      # NOTE: The fixture commits the '.uid' files Godot generates, so that
      # packaging it again reimports to identical contents and publishes nothing.
      - name: Create a fixture addon repository
        env:
          GODOT_VERSION: ${{ steps.version.outputs.value }}
        run: |
          git init --quiet --initial-branch=main
          git config user.name "fixture"
          git config user.email "fixture@example.invalid"

          git init --quiet --bare "$RUNNER_TEMP/origin.git"
          git remote add origin "file://$RUNNER_TEMP/origin.git"

          mkdir -p addons/fixture/example

          echo "v${GODOT_VERSION#v}" > .godot-version
          echo ".godot/" > .gitignore
          printf 'config_version=5\n\n[application]\n\nconfig/name="fixture"\n' > project.godot

          printf '[plugin]\n\nname="fixture"\ndescription=""\nauthor=""\nversion="0.0.0"\nscript=""\n' > addons/fixture/plugin.cfg
          printf 'extends RefCounted\n' > addons/fixture/a.gd
          printf 'extends RefCounted\n' > addons/fixture/a_test.gd
          printf 'extends RefCounted\n' > addons/fixture/example/x.gd

          godot --editor --headless --import --quit || :

          git add --all
          git commit --quiet --message "add fixture"
          git push --quiet origin main

      - name: Publish the fixture
        uses: $/actions/package-addon
        with:
          subfolder: fixture
          tag: dist/v0.0.1
          file-excludes: |
            **/example
            **/*_test.gd
            **/*_test.gd.uid

      - name: Change the fixture
        run: |
          git checkout --quiet main
          echo "# changed" >> addons/fixture/a.gd
          git commit --quiet --all --message "change fixture"
          git push --quiet origin main

      - name: Publish the changed fixture
        uses: $/actions/package-addon
        with:
          subfolder: fixture
          tag: dist/v0.0.2
          file-excludes: |
            **/example
            **/*_test.gd
            **/*_test.gd.uid

      - name: Return to the fixture source
        run: git checkout --quiet main

      - name: Republish the unchanged fixture
        uses: $/actions/package-addon
        with:
          subfolder: fixture
          tag: dist/v0.0.2
          file-excludes: |
            **/example
            **/*_test.gd
            **/*_test.gd.uid

      - name: Verify the published branch and tags
        run: |
          fail() {
            echo "::error::$1"
            exit 1
          }

          origin() {
            git -C "$RUNNER_TEMP/origin.git" "$@"
          }

          [[ "$(origin rev-list --count dist)" == "2" ]] ||
            fail "'dist' should hold exactly two commits"
          [[ "$(origin rev-list --max-parents=0 dist)" == "$(origin rev-parse dist~1)" ]] ||
            fail "'dist' should start without history"
          ! origin merge-base --is-ancestor main dist ||
            fail "'main' should not be an ancestor of 'dist'"

          [[ "$(origin rev-parse refs/tags/dist/v0.0.1)" == "$(origin rev-parse dist~1)" ]] ||
            fail "'dist/v0.0.1' should tag the first publish"
          [[ "$(origin rev-parse refs/tags/dist/v0.0.2)" == "$(origin rev-parse dist)" ]] ||
            fail "'dist/v0.0.2' should tag the second publish"

          origin cat-file -e dist:plugin.cfg ||
            fail "'plugin.cfg' should be published at the branch root"
          for excluded in a_test.gd a_test.gd.uid example; do
            ! origin cat-file -e "dist:$excluded" 2>/dev/null ||
              fail "'$excluded' should be excluded"
          done

  # Used to ensure all branch protection requirements are met. This is a workaround until
  # https://github.com/github-community/community/discussions/4324 is addressed.
  branch_protection:
    needs: ["changes", "check-python", "check-shell", "check-workflows", "export", "package-addon"]
    if: ${{ always() }}

    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Verify status of dependencies
        if: |
          always() &&
          (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        run: exit 1
