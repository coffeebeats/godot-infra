name: "🌐 Sync: Translation catalogue"
description: "Run the 'godot' agent plugin's translation catalogue tooling over a Godot project."

inputs:
  command:
    description: "The subcommand to run: 'validate', 'update' or 'compile'."
    required: true
  locale-dir:
    description: "The directory holding the translation catalogue, relative to the repository root."
    required: false
    default: "project/locale"
  verify:
    description: "Whether to assert the transform is deterministic."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Sync the translation catalogue
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        LOCALE_DIR: ${{ inputs.locale-dir }}
        VERIFY: ${{ inputs.verify }}
      run: |
        # NOTE: A plugin cannot reach files outside its own directory, so the
        # catalogue tooling lives in the agent plugin and CI runs that copy.
        GODOT_LOCALE="$(realpath "$GITHUB_ACTION_PATH/../../../plugins/godot/bin/godot-locale")"

        if [[ "$VERIFY" == "true" ]]; then
          "$GODOT_LOCALE" "$COMMAND" --verify
        else
          "$GODOT_LOCALE" "$COMMAND"
        fi
