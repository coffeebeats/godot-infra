# pyproject.toml
#
# Python tooling for this repository's scripts and CI.
#
# NOTE: `gdtoolkit` here lints this repository's own GDScript. `check-godot-project`
# installs a consuming repository's copy from that repository's own lockfile.

[project]
name = "tooling"
version = "0.0.0"
requires-python = ">=3.13"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "gdtoolkit>=4.5.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
