name: "📦🔧 Package: Addon"
description: "Packages a plugin or compiled gdextension directory and publishes it as a commit on a distribution branch."

inputs:
  subfolder:
    description: "The subfolder under 'addons' that the plugin should be placed."
    required: true
  target-branch:
    description: "The branch to publish the packaged addon to. Each run commits on top of it; a missing branch starts without history."
    required: false
    default: dist
  path:
    description: "The path to the addon's root directory."
    required: false
    default: .
  godot-editor-version:
    description: "The Godot editor version to use for reimporting (e.g. 'v4.7.2-stable'; default: the '.godot-version' pin)."
    required: false
    default: ""
  file-excludes:
    description: "A comma or newline-delimited list of glob patterns to exclude addon files."
    required: false
  tag:
    description: "A tag to create on the published commit (e.g. 'dist/v1.2.3'). An existing tag must already point at that commit."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Identify commit
      id: commit
      shell: bash
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - uses: $/.github/actions/parse-godot-version
      if: inputs.godot-editor-version == ''
      id: version
      with:
        gdenv-pin-path: .godot-version

    - uses: $/.github/actions/setup-godot
      with:
        version: ${{ inputs.godot-editor-version || steps.version.outputs.semantic }}

    - name: Construct addon directory
      id: addon
      shell: bash
      run: |
        echo "Current directory: $PWD"

        PACKAGE_DIR="${{ runner.temp }}/addon"
        echo "Constructing addon directory: $PACKAGE_DIR"

        # NOTE: A previous run in the same job leaves this directory behind.
        rm -rf "$PACKAGE_DIR"
        mkdir "$PACKAGE_DIR"

        # Set options to enable more extensive globbing.
        shopt -s extglob
        shopt -s globstar

        if [[ ! -d "addons/${{ inputs.subfolder }}" ]]; then
          echo "Addon not found under 'addons/'; assuming addon is root-level."
          cp -r * "$PACKAGE_DIR"
        else
          echo "Addon found under 'addons/'; moving addon files."

          # Move nested files into the repository root.
          cp +(LICENSE|license)* "$PACKAGE_DIR" 2>/dev/null || :
          cp +(README|readme)* "$PACKAGE_DIR" 2>/dev/null || :
          cp -r addons/${{ inputs.subfolder }}/* "$PACKAGE_DIR" 2>/dev/null || :
        fi

    - name: Prune addon source
      working-directory: ${{ runner.temp }}/addon
      shell: bash
      run: |
        echo "Pruning files from addon directory: ${{ runner.temp }}/addon"

        # Set options to enable more extensive globbing.
        shopt -s extglob
        shopt -s globstar

        # Remove development/project-related files.
        rm -f project.godot
        rm -rf script_templates

        # Remove all nested addon dependencies.
        rm -rf addons

        # Remove manually specified
        set -f

        for pattern in $(
            set -f
            echo "${{ inputs.file-excludes }}" | tr ',' '\n' | sed -E 's/\\n/ /'
        ); do
            if [[ "$(
                set +f
                realpath -m "${pattern/\~/$HOME}"
            )" != "$PWD"* ]]; then
                echo "Refusing to execute insecure pattern: $pattern"
                exit 1
            fi

            echo "Removing files that match pattern: $pattern"
            (
                set +f
                rm -rf $pattern
            )
        done

        set +f

    - name: Add a '.gitignore' file
      working-directory: ${{ runner.temp }}/addon
      shell: bash
      run: |
        if [[ ! -f ".gitignore" ]]; then
            touch ".gitignore"
        else
          echo "" >> ".gitignore"
        fi

        cat <<EOM >> ".gitignore"
        # DO NOT EDIT: The below entries were generated by 'coffeebeats/godot-infra/actions/package-addon':

        # MacOS-specific ignores
        .DS_Store

        # Windows-specific ignores
        ~*
        *.TMP
        EOM

    # NOTE: Godot writes text files with LF endings. A consumer checking the branch out
    # under 'core.autocrlf' gets CRLF instead, so the editor's rewrite of an unchanged
    # '*.import' file changes its size, which git reports as a modification.
    - name: Add a '.gitattributes' file
      working-directory: ${{ runner.temp }}/addon
      shell: bash
      run: |
        cat <<EOM > ".gitattributes"
        # DO NOT EDIT: The below entries were generated by 'coffeebeats/godot-infra/actions/package-addon':

        * text=auto eol=lf
        EOM

    # Rewrite resource references from the addon's development paths to the paths a
    # consumer installs it at. Godot resolves the 'uid://' beside each reference first, so
    # this is only the fallback, which a project with a stale UID cache is left with. The
    # path cannot simply be dropped: the text loader rejects a reference without one.
    - name: Rewrite resource paths
      shell: bash
      run: |
        PACKAGE_DIR="${{ runner.temp }}/addon"
        TARGET="addons/${{ inputs.subfolder }}"

        # Only the addon's own top-level directories are rewritten, so a reference to a
        # dependency, like 'res://addons/std/...', is left alone.
        DIRS="$(
          find "$PACKAGE_DIR" -mindepth 1 -maxdepth 1 -type d \
            -not -name '.*' -not -name addons -printf '%f\n' | paste -sd'|'
        )"

        if [[ -z "$DIRS" ]]; then
          echo "No resource directories found; skipping."
          exit 0
        fi

        echo "Rewriting resource paths to '$TARGET' for directories: $DIRS"

        find "$PACKAGE_DIR" -type f \( -name '*.tscn' -o -name '*.tres' \) -print0 |
          xargs -0 --no-run-if-empty sed -i -E \
            "s#path=\"res://($DIRS)/#path=\"res://$TARGET/\1/#g"

        # Every remaining reference must name an addon: this one or a dependency.
        if grep -rnP 'path="res://(?!addons/)' --include='*.tscn' --include='*.tres' "$PACKAGE_DIR"; then
          echo "::error::The resource paths above name no addon directory, so they will not resolve once the addon is installed."
          exit 1
        fi

    # Reimport assets so '*.import' files are updated.
    - name: Reimport assets
      shell: bash
      run: |
        echo "Current directory: $PWD"

        PACKAGE_DIR="${{ runner.temp }}/addon"
        echo "Reimporting assets in addon directory: $PACKAGE_DIR"

        PROJECT_DIR="addons/${{ inputs.subfolder }}"
        echo "Installing into project directory: $PROJECT_DIR"

        if [[ ! -f "project.godot" ]]; then
          CREATED_PROJECT_MANIFEST=1
          touch project.godot
        fi

        # Add packaged directory into project as an addon. This ensures paths
        # within '*.import' files match what a project would require.
        rm -rf "$PROJECT_DIR"
        mkdir -p "$(dirname $PROJECT_DIR)"
        mv "$PACKAGE_DIR" "$PROJECT_DIR"

        # NOTE: It's okay if this fails, probably. For example, coffeebeats/gut
        # at '24f97b756fcc6a82375ef24b44c84bb1ee781786' fails with Godot
        # 'v4.3-stable', but after the relevant imports occur.
        godot --editor --headless --import --quit || :

        # Move the updated addon folder to the target path.
        mv "$PROJECT_DIR" "$PACKAGE_DIR"

        if [[ $CREATED_PROJECT_MANIFEST -eq 1 ]]; then
          rm project.godot
        fi

    - name: Inspect packaged addon
      working-directory: ${{ runner.temp }}/addon
      shell: bash
      run: "tree -lha --dirsfirst -I .git"

      # Reset the working tree since we don't need to keep edits.
    - name: Restore worktree
      shell: bash
      run: |
        git restore .
        git clean -fd

    - name: Replace the target branch's contents
      shell: bash
      env:
        PACKAGE_DIR: ${{ runner.temp }}/addon
        TARGET_BRANCH: ${{ inputs.target-branch }}
      run: |
        # NOTE: A new branch starts without history, so the packaged branch
        # never carries the source repository's history or its binaries.
        if [[ -z "$(git ls-remote --heads origin "$TARGET_BRANCH")" ]]; then
          git checkout --orphan "$TARGET_BRANCH"
        else
          # NOTE: Committing on top of the branch only needs its tip.
          git fetch --depth=1 origin "+refs/heads/$TARGET_BRANCH:refs/heads/$TARGET_BRANCH"
          git checkout "$TARGET_BRANCH"
        fi

        # Set options to enable more extensive globbing.
        shopt -s extglob
        shopt -s globstar

        rm -rf * .@(!(.||git))

        echo "Target addon workspace (before):"
        tree -lha --dirsfirst -I .git

        cp -r "$PACKAGE_DIR"/* "$PACKAGE_DIR/.gitignore" "$PACKAGE_DIR/.gitattributes" .

        echo "Target addon workspace (after):"
        tree -lha --dirsfirst -I .git

    - uses: $/actions/commit-changes
      with:
        description: "updating \\`${{ inputs.subfolder }}\\` to ${{ inputs.tag || steps.commit.outputs.sha_short }}"
        target-branch: ${{ inputs.target-branch }}

    - name: Tag the published commit
      if: inputs.tag != ''
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        # NOTE: An annotated tag lists its commit last, as '<tag>^{}'.
        EXISTING="$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | awk '{ sha = $1 } END { print sha }')"
        HEAD_SHA="$(git rev-parse HEAD)"

        # NOTE: Tags never move, but a re-run can find its tag on this commit.
        if [[ -z "$EXISTING" ]]; then
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
        elif [[ "$EXISTING" == "$HEAD_SHA" ]]; then
          echo "Tag '$TAG' already points at $HEAD_SHA; skipping."
        else
          echo "Tag '$TAG' points at $EXISTING, not $HEAD_SHA; tags are immutable."
          exit 1
        fi
