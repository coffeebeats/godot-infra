name: "▶️ Boot: Exported Godot game"
description: "Launches an exported game headlessly and fails if it logs a failure while booting."

inputs:
  path:
    description: "Path to the directory holding the exported game's '.tar' archives."
    required: true
  platform:
    description: "The platform the game was exported for ('windows', 'macos' or 'linux')."
    required: true
  expected-logs:
    description: "Newline-separated extended regexes; the boot log must match every one."
    required: false
    default: ""
  ignored-logs:
    description: "Newline-separated extended regexes; a matching line never fails the boot."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # NOTE: macOS ships bash 3.2, so this action avoids 'mapfile' throughout.
    - name: Unpack and locate the exported game
      id: game
      shell: bash
      env:
        EXPORTS_DIR: ${{ inputs.path }}
        GAME_DIR: ${{ runner.temp }}/boot-game
        PLATFORM: ${{ inputs.platform }}
      run: |
        # NOTE: A Windows runner hands over paths like 'D:\a\_temp', which the
        # tools below read as a host name or mangle outright, so they are
        # converted once here rather than escaped at each call.
        if command -v cygpath >/dev/null 2>&1; then
          EXPORTS_DIR="$(cygpath -u "$EXPORTS_DIR")"
          GAME_DIR="$(cygpath -u "$GAME_DIR")"
        fi

        mkdir -p "$GAME_DIR"

        # NOTE: 'failglob' turns an empty download into an error.
        shopt -s failglob

        for ARCHIVE in "$EXPORTS_DIR"/*.tar; do
          tar -xf "$ARCHIVE" -C "$GAME_DIR"
        done

        # A preset exports macOS as a bundle or as a zipped one, so the zip is
        # unpacked beside itself and one search finds both shapes.
        case "$PLATFORM" in
          windows)
            # NOTE: 'export_console_wrapper' writes a second '<name>.console.exe'
            # beside the game, which is the same build with a console attached.
            FILTER=(-type f -name '*.exe' ! -name '*.console.exe')
            ;;
          macos)
            while IFS= read -r ZIP; do
              unzip -q "$ZIP" -d "$(dirname "$ZIP")"
            done < <(find "$GAME_DIR" -maxdepth 3 -type f -name '*.zip')

            FILTER=(-type f -perm -u+x -path '*.app/Contents/MacOS/*')
            ;;
          linux)
            FILTER=(-type f -perm -u+x ! -name '*.so' ! -name '*.pck' ! -name '*.sh')
            ;;
          *)
            echo "::error::Cannot boot a game exported for '$PLATFORM'."
            exit 1
            ;;
        esac

        GAMES=()
        while IFS= read -r FOUND; do
          GAMES+=("$FOUND")
        done < <(find "$GAME_DIR" -maxdepth 5 "${FILTER[@]}")

        if [[ ${#GAMES[@]} -ne 1 ]]; then
          echo "::error::Expected one game executable, found ${#GAMES[@]}."
          printf '%s\n' "${GAMES[@]}"
          exit 1
        fi

        echo "path=${GAMES[0]}" >> "$GITHUB_OUTPUT"

    - name: Boot the game
      shell: bash
      env:
        GAME: ${{ steps.game.outputs.path }}
        LOG_PATH: ${{ runner.temp }}/boot.log
        REPORT_PATH: ${{ runner.temp }}/boot-report.log
        EXPECTED_LOGS: ${{ inputs.expected-logs }}
        IGNORED_LOGS: ${{ inputs.ignored-logs }}
      run: |
        if command -v cygpath >/dev/null 2>&1; then
          LOG_PATH="$(cygpath -u "$LOG_PATH")"
          REPORT_PATH="$(cygpath -u "$REPORT_PATH")"
        fi

        # A script the template cannot parse takes down everything depending on
        # it, and the engine keeps running regardless: it logs the error, drops
        # the main scene and carries on. The log decides, and the exit code only
        # confirms.
        #
        # NOISE is the teardown boilerplate a clean run still prints, matching
        # what 'plugins/godot/hooks/on_edit.py' filters.
        NOISE='^WARNING: [0-9]+ ObjectDB instances were leaked|^   at: cleanup '
        NOISE="$NOISE|^ERROR: [0-9]+ resources still in use at exit|^   at: clear "

        # NOTE: A workflow stored with CRLF hands over patterns ending in a
        # carriage return, which match nothing and look correct in an error.
        EXPECTED_LOGS="${EXPECTED_LOGS//$'\r'/}"
        IGNORED_LOGS="${IGNORED_LOGS//$'\r'/}"

        # A game reaching for a service the runner does not have logs errors
        # that say nothing about whether it booted, so the caller names those.
        # A script that failed to load looks nothing like them and still trips
        # FAILURE.
        while IFS= read -r PATTERN; do
          [[ -z "$PATTERN" ]] && continue

          NOISE="$NOISE|$PATTERN"
        done <<< "$IGNORED_LOGS"

        FAILURE='^(SCRIPT ERROR|USER SCRIPT ERROR|ERROR):'
        FAILURE="$FAILURE|Parse Error|Compile Error"
        FAILURE="$FAILURE|Failed to load script|Failed to instantiate"

        # NOTE: 300 frames covers autoloads, the main scene and a first draw.
        # The run is uncapped headless, so it costs a moment.
        set +e
        "$GAME" --headless --quit-after 300 >"$LOG_PATH" 2>&1
        CODE=$?
        set -e

        cat "$LOG_PATH"

        # NOTE: Filtering into a file keeps 'grep -q' out of a pipeline, where
        # it can close the pipe early and leave 'pipefail' reporting 141.
        grep -Ev "$NOISE" "$LOG_PATH" >"$REPORT_PATH" || true

        if grep -qE "$FAILURE" "$REPORT_PATH"; then
          echo "::error::The exported game logged a failure while booting."
          grep -nE "$FAILURE" "$REPORT_PATH"
          exit 1
        fi

        # Looking only for failures passes a game that never ran far enough to
        # fail. A scene whose script was dropped takes its own error reporting
        # with it and boots quietly, so each pattern proves that code ran.
        MISSING=0

        while IFS= read -r PATTERN; do
          [[ -z "$PATTERN" ]] && continue

          if ! grep -qE "$PATTERN" "$LOG_PATH"; then
            echo "::error::The exported game never logged an expected line: $PATTERN"
            MISSING=1
          fi
        done <<< "$EXPECTED_LOGS"

        if [[ $MISSING -ne 0 ]]; then
          exit 1
        fi

        if [[ $CODE -ne 0 ]]; then
          echo "::error::The exported game exited with code $CODE."
          exit 1
        fi
